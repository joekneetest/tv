          class TileView(ctx: Context, u: Float, w: Int, h: Int) : GlassView(ctx, u, (w * u).toInt(), (h * u).toInt()) {

              private val text = TextPaint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xFFFFFFFF.toInt()
