              }
              private val artPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val dimPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0x4D000000 }
              private val shadePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  shader = LinearGradient(0f, pad + cardH * 0.40f, 0f, (pad + cardH).toFloat(), 0x00000000, 0xCC000000.toInt(), Shader.TileMode.CLAMP)
              }

              private var banner: Bitmap? = null
              private var ambient: Bitmap? = null
              private var icon: Drawable? = null
              private var artShader: BitmapShader? = null
              private var hasArt = false
              private var reveal = 1f
              private var shown = ""

              var nameMode = 0   // 0 on focus, 1 always, 2 never
              var isAdd = false
                  set(v) { field = v; invalidate() }
              var font: Typeface = Typeface.DEFAULT
                  set(v) { field = v; text.typeface = v; relabel() }
              var label: String = ""
                  set(v) { field = v; relabel() }

              private fun relabel() {
                  shown = TextUtils.ellipsize(label, text, cardW - 32f * u, TextUtils.TruncateAt.END).toString()
                  invalidate()
              }

              fun setArt(b: Bitmap?, a: Bitmap?, i: Drawable?) {
                  val had = hasArt
                  banner = b
                  ambient = a
                  icon = i
                  hasArt = b != null || a != null || i != null
                  val bmp = b ?: a
                  if (bmp == null) {
                      artShader = null
                  } else {
                      val sh = BitmapShader(bmp, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP)
                      val sc = max(cardW.toFloat() / bmp.width, cardH.toFloat() / bmp.height)
                      val m = Matrix()
                      m.setScale(sc, sc)
                      m.postTranslate(pad + (cardW - bmp.width * sc) / 2f, pad + (cardH - bmp.height * sc) / 2f)
                      sh.setLocalMatrix(m)
                      artShader = sh
                  }
                  if (hasArt && !had) {
                      reveal = 0f
                      ValueAnimator.ofFloat(0f, 1f).apply {
                          duration = 220
                          addUpdateListener { reveal = it.animatedValue as Float; invalidate() }
                          start()
                      }
                  }
                  invalidate()
              }

              override fun onDraw(c: Canvas) {
                  drawBase(c)
                  val r = rr
                  val la = if (isAdd) p else when (nameMode) { 0 -> p; 1 -> 1f; else -> 0f }
                  val lift = cardH * 0.05f * la

                  if (!isAdd) {
                      val sh = artShader
                      if (sh != null) {
                          artPaint.shader = sh
                          artPaint.alpha = (255 * reveal).toInt()
                          c.drawRoundRect(rect, r, r, artPaint)
                          if (banner == null) c.drawRoundRect(rect, r, r, dimPaint)
                      }
                      val ic = icon
                      if (ic != null && banner == null) {
                          val sz = (cardH * 0.58f).toInt()
                          val cx = pad + cardW / 2f
                          val cy = pad + cardH / 2f - lift
                          ic.setBounds((cx - sz / 2f).toInt(), (cy - sz / 2f).toInt(), (cx + sz / 2f).toInt(), (cy + sz / 2f).toInt())
                          ic.setAlpha((255 * reveal).toInt())
                          ic.draw(c)
                      }
                  } else {
                      plus.strokeWidth = 2.6f * u
                      val a = cardH * 0.17f
                      val mx = pad + cardW / 2f
                      val my = pad + cardH / 2f - lift
                      c.drawLine(mx - a, my, mx + a, my, plus)
                      c.drawLine(mx, my - a, mx, my + a, plus)
                  }

                  if (la > 0.02f) {
                      shadePaint.alpha = (255 * la).toInt()
                      c.drawRoundRect(rect, r, r, shadePaint)
                      text.alpha = (255 * la).toInt()
                      c.drawText(shown, pad + 16f * u, pad + cardH - 14f * u + (1f - la) * 6f * u, text)
                  }
                  drawTop(c)
              }
          }

