                  }
                  rowBox.addView(tiles, LinearLayout.LayoutParams(0, WRAP, 1f))
                  middle.addView(rowBox, FrameLayout.LayoutParams(MATCH, WRAP, Gravity.BOTTOM))
                  content.addView(middle, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  root.addView(content, FrameLayout.LayoutParams(MATCH, MATCH))

                  buildOverlay(root)
                  setContentView(root)
                  applyConfig()
                  if (apps.isNotEmpty()) { firstFocusDone = true; focusTile(0) }
              }

              private fun buildOverlay(root: FrameLayout) {
                  overlay = FrameLayout(this).apply {
                      visibility = View.GONE
                      isClickable = true
                      setBackgroundColor(0xB3000000.toInt())
                  }
                  val panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(s(28), s(24), s(28), s(22))
                      background = roundRect(0xF2101420.toInt(), 0x33FFFFFF, 26)
                  }
                  overlayTitle = tv("", 22f, Color.WHITE)
                  panel.addView(overlayTitle, LinearLayout.LayoutParams(WRAP, WRAP).apply { bottomMargin = s(14) })
                  scroll = ScrollView(this).apply { isVerticalScrollBarEnabled = false }
                  overlayList = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  scroll.addView(overlayList)
                  panel.addView(scroll, LinearLayout.LayoutParams(MATCH, s(300)))
                  overlay.addView(panel, FrameLayout.LayoutParams(s(600), WRAP, Gravity.CENTER))
                  root.addView(overlay, FrameLayout.LayoutParams(MATCH, MATCH))
              }

              private fun requestHighRefresh() {
                  if (Build.VERSION.SDK_INT < 23) return
                  try {
                      @Suppress("DEPRECATION")
                      val d = windowManager.defaultDisplay
                      val cur = d.mode
                      val best = d.supportedModes
                          .filter { it.physicalWidth == cur.physicalWidth && it.physicalHeight == cur.physicalHeight }
                          .maxByOrNull { it.refreshRate } ?: return
                      val lp = window.attributes
                      lp.preferredDisplayModeId = best.modeId
                      window.attributes = lp
                  } catch (e: Exception) { }
              }

              private fun style(g: GlassView) {
                  val lite = cfg.effects == 1
                  g.accent = cfg.accent
                  g.radius = Config.RADII[cfg.corners.coerceIn(0, 2)]
                  g.glowOn = cfg.glow == 1 && !lite
                  g.zoom = Config.ZOOMS[cfg.zoom.coerceIn(0, 2)]
                  g.focusMs = (180f / cfg.speed / (if (lite) 1.5f else 1f)).toLong()
              }

              /** Pushes every setting into the views. Safe to call any time. */
              private fun applyConfig() {
                  bg.mode = cfg.wall
                  bg.speed = cfg.speed
                  bg.lite = cfg.effects == 1
                  if (cfg.wall == 3 && bg.photo == null) loadWallpaper(false)

                  face = Typeface.create(Config.FONTS[cfg.font.coerceIn(0, 3)], Typeface.NORMAL)
                  logo.text = cfg.logo
                  for (t in listOf(logo, clockView, weatherView, bigClock, bigDate)) t.typeface = face
                  bigDate.visibility = if (cfg.showDate == 1) View.VISIBLE else View.GONE
                  bigBox.visibility = if (cfg.clockStyle == 1) View.VISIBLE else View.GONE
                  clockView.visibility = if (cfg.clockStyle == 1) View.GONE else View.VISIBLE
                  wifi.visibility = if (cfg.wifiOn == 1) View.VISIBLE else View.GONE
                  weatherView.visibility = if (cfg.weatherOn == 1 && weatherText.isNotEmpty()) View.VISIBLE else View.GONE
                  gear.accent = cfg.accent

                  val lp = rowBox.layoutParams as FrameLayout.LayoutParams
                  when (cfg.pos) {
                      0 -> { lp.gravity = Gravity.CENTER_VERTICAL; lp.bottomMargin = s(40) }
                      1 -> { lp.gravity = Gravity.BOTTOM; lp.bottomMargin = s(96) }
                      else -> { lp.gravity = Gravity.BOTTOM; lp.bottomMargin = s(28) }
                  }
                  rowBox.layoutParams = lp

                  if (builtSize != cfg.tileSize) {
                      builtSize = cfg.tileSize
                      rebuildRecent()
                      tiles.adapter = adapter
                  } else {
                      adapter.notifyDataSetChanged()
                  }
                  style(recent)
                  recent.font = face
                  updateRecent()
                  fetchWeather()
                  fetchOnline()
                  handler.removeCallbacks(tick)
                  handler.post(tick)
              }

              private fun rebuildRecent() {
                  if (::recent.isInitialized) rowBox.removeView(recent)
                  val dims = Config.SIZES[cfg.tileSize.coerceIn(0, 2)]
                  recent = RecentCard(this, u, (dims.first * 1.4f).toInt(), dims.second)
                  recent.setOnClickListener { cfg.recentPkg?.let { launch(it) } }
                  rowBox.addView(recent, LinearLayout.LayoutParams(WRAP, WRAP).apply { marginStart = s(6) })
              }

              // ------------------------------------------------------------------ lifecycle

              override fun onResume() {
                  super.onResume()
                  loadApps(false)
                  updateRecent()
                  fetchWeather()
                  handler.removeCallbacks(tick)
                  handler.post(tick)
              }

              override fun onPause() {
                  handler.removeCallbacks(tick)
                  super.onPause()
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  closeOverlay()
                  focusTile(0)
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  when (keyCode) {
                      KeyEvent.KEYCODE_MENU, KeyEvent.KEYCODE_SETTINGS -> {
                          if (overlayOpen) closeOverlay() else openSettings()
                          return true
                      }
                      KeyEvent.KEYCODE_ESCAPE -> {
                          if (overlayOpen) closeOverlay()
                          return true
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (overlayOpen) closeOverlay()
              }

              // ------------------------------------------------------------------ apps

              private fun canLaunch(pkg: String): Boolean {
                  val pm = packageManager
                  return pm.getLeanbackLaunchIntentForPackage(pkg) != null || pm.getLaunchIntentForPackage(pkg) != null
              }

              private fun ambientOf(d: Drawable): Bitmap {
                  val big = Bitmap.createBitmap(64, 64, Bitmap.Config.ARGB_8888)
                  d.setBounds(0, 0, 64, 64)
                  d.draw(Canvas(big))
                  val small = Bitmap.createScaledBitmap(big, 4, 4, true)
                  big.recycle()
                  return small
              }

              private fun toBitmap(d: Drawable, w: Int, h: Int): Bitmap {
                  val b = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                  d.setBounds(0, 0, w, h)
                  d.draw(Canvas(b))
                  return b
              }

              private fun loadArt(e: AppEntry, pm: PackageManager) {
                  val ic = pm.getApplicationIcon(e.pkg)
                  e.icon = ic
                  e.ambient = ambientOf(ic)
                  e.banner = try {
                      val li = pm.getLeanbackLaunchIntentForPackage(e.pkg)
                      val b = (if (li != null) pm.getActivityBanner(li) else null) ?: pm.getApplicationBanner(e.pkg)
                      if (b != null) toBitmap(b, 480, 270) else null
                  } catch (ex: Exception) { null }
              }

              private fun loadApps(force: Boolean) {
                  if (loading) return
                  if (!force && apps.isNotEmpty() && apps.all { it.icon != null && canLaunch(it.pkg) } &&
                      cfg.pinned == apps.map { it.pkg }) return
                  loading = true
                  Thread {
                      val pm = packageManager
                      val pins = cfg.pinned ?: Presets.apps
                          .mapNotNull { p -> p.pkgs.firstOrNull { canLaunch(it) } }
                          .also { cfg.pinned = it }
                      val list = pins.mapNotNull { pkg ->
                          try {
                              val label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString()
                              cfg.setLabel(pkg, label)
                              val e = AppEntry(pkg, label)
                              loadArt(e, pm)
                              e
                          } catch (ex: Exception) { null }
                      }
                      runOnUiThread {
                          loading = false
                          if (list.map { it.pkg } == apps.map { it.pkg }) {
                              apps.forEachIndexed { i, old ->
                                  val n = list[i]
                                  old.label = n.label; old.icon = n.icon; old.banner = n.banner; old.ambient = n.ambient
                              }
                              adapter.notifyItemRangeChanged(0, apps.size)
                          } else {
                              apps = list
                              adapter.notifyDataSetChanged()
                          }
                          if (!firstFocusDone) { firstFocusDone = true; focusTile(0) }
                          updateRecent()
                          fetchOnline()
                      }
                  }.start()
              }

              private fun onlineUrl(e: AppEntry): String? =
                  cfg.img(e.pkg) ?: if (cfg.art == 1) Presets.domainFor(e.pkg)?.let { "https://www.google.com/s2/favicons?domain=$it&sz=256" } else null

              private fun fetchOnline() {
                  if (fetching) return
                  val pending = apps.filter { it.online == null && onlineUrl(it) != null }
                  if (pending.isEmpty()) return
                  fetching = true
                  Thread {
                      for (e in pending) {
                          val url = onlineUrl(e) ?: continue
                          val bmp = Net.get(this, url, 512) ?: continue
                          e.online = bmp
                          e.onlineAmbient = Bitmap.createScaledBitmap(bmp, 4, 4, true)
                          e.onlineWide = bmp.width >= bmp.height * 1.5f
                          runOnUiThread { adapter.notifyDataSetChanged() }
                      }
                      runOnUiThread { fetching = false }
                  }.start()
              }

              private fun loadWallpaper(refresh: Boolean) {
                  if (photoLoading) return
                  photoLoading = true
                  Thread {
                      val file = File(filesDir, "wall.jpg")
                      var bmp: Bitmap? = null
                      if (!refresh && file.exists()) bmp = Net.decode(file.readBytes(), 1920)
                      if (bmp == null) {
                          val bytes = Net.fetch(cfg.wallUrl)
                          if (bytes != null) {
                              bmp = Net.decode(bytes, 1920)
                              if (bmp != null) try { file.writeBytes(bytes) } catch (e: Exception) { }
                          }
                      }
                      runOnUiThread {
                          photoLoading = false
                          if (bmp != null) bg.photo = bmp
                      }
                  }.start()
              }

              private fun fetchWeather() {
                  if (cfg.weatherOn != 1) return
                  val now = System.currentTimeMillis()
                  if (weatherText.isNotEmpty() && now - weatherAt < 30 * 60 * 1000L) return
                  weatherAt = now
                  Thread {
                      val t = Net.text("https://wttr.in/?format=%25t")?.trim()?.removePrefix("+") ?: ""
                      if (t.isNotEmpty() && t.length <= 8) {
                          runOnUiThread {
                              weatherText = t
                              weatherView.text = t
                              weatherView.visibility = if (cfg.weatherOn == 1) View.VISIBLE else View.GONE
                          }
                      }
                  }.start()
              }

              private fun savePins() { cfg.pinned = apps.map { it.pkg } }

              private fun focusTile(idx: Int) {
                  val i = idx.coerceIn(0, apps.size)
                  tiles.scrollToPosition(i)
                  tiles.postDelayed({ tiles.findViewHolderForAdapterPosition(i)?.itemView?.requestFocus() }, 80)
              }

              private fun launch(pkg: String) {
                  val pm = packageManager
                  val i = pm.getLeanbackLaunchIntentForPackage(pkg) ?: pm.getLaunchIntentForPackage(pkg) ?: return
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  try {
                      startActivity(i)
                      cfg.recentPkg = pkg
                      cfg.recentTime = System.currentTimeMillis()
                      overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
                  } catch (e: ActivityNotFoundException) { }
              }

              private fun prompt(title: String, initial: String, onOk: (String) -> Unit) {
                  val et = EditText(this)
                  et.setText(initial)
                  et.setSingleLine()
                  et.setSelection(et.text.length)
                  AlertDialog.Builder(this)
                      .setTitle(title)
                      .setView(et)
                      .setPositiveButton("Save") { _, _ -> onOk(et.text.toString().trim()); refreshValues() }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              private fun appMenu(i: Int) {
                  val a = apps.getOrNull(i) ?: return
                  val rows = mutableListOf(
                      Row("Move left") { move(i, -1) },
                      Row("Move right") { move(i, 1) },
                      Row("Remove from home") { remove(i) },
                      Row("Set image URL") {
                          closeOverlay()
                          prompt("Image URL (wide 16:9 pictures fill the tile)", cfg.img(a.pkg) ?: "https://") { url ->
                              if (url.length > 8) { cfg.setImg(a.pkg, url); a.online = null; fetchOnline() }
                          }
                      },
                      Row("App info") {
                          closeOverlay()
                          startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:${a.pkg}")))
                      },
                      Row("Uninstall") {
                          closeOverlay()
                          startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:${a.pkg}")))
                      }
                  )
                  if (cfg.img(a.pkg) != null) {
                      rows.add(4, Row("Reset image") {
                          cfg.setImg(a.pkg, null); a.online = null; a.onlineAmbient = null
                          adapter.notifyDataSetChanged(); closeOverlay(); fetchOnline()
                      })
                  }
                  showOverlay(a.label, rows)
              }

              private fun move(i: Int, d: Int) {
                  val j = i + d
                  if (j < 0 || j >= apps.size) { closeOverlay(); return }
                  val m = apps.toMutableList()
                  val t = m[i]; m[i] = m[j]; m[j] = t
                  apps = m
                  savePins()
                  adapter.notifyDataSetChanged()
                  closeOverlay()
                  focusTile(j)
              }

              private fun remove(i: Int) {
                  apps = apps.filterIndexed { k, _ -> k != i }
                  savePins()
                  adapter.notifyDataSetChanged()
                  closeOverlay()
                  focusTile(i)
              }

              private fun openPicker() {
                  Thread {
                      val pm = packageManager
                      fun q(cat: String) = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(cat), 0)
                      val pinned = apps.map { it.pkg }.toSet()
                      val rows = (q(Intent.CATEGORY_LEANBACK_LAUNCHER) + q(Intent.CATEGORY_LAUNCHER))
                          .map { it.activityInfo.packageName }
                          .distinct()
                          .filter { it != packageName && it !in pinned }
                          .mapNotNull { pkg ->
                              try {
                                  val e = AppEntry(pkg, pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString())
                                  loadArt(e, pm)
                                  e
                              } catch (ex: Exception) { null }
                          }
                          .sortedBy { it.label.lowercase() }
                          .map { e ->
                              Row(e.label, icon = e.icon) {
                                  cfg.setLabel(e.pkg, e.label)
                                  apps = apps + e
                                  savePins()
                                  adapter.notifyDataSetChanged()
                                  closeOverlay()
                                  focusTile(apps.size - 1)
                                  fetchOnline()
                              }
                          }
                      runOnUiThread { showOverlay("Add app", rows) }
                  }.start()
              }

              // ------------------------------------------------------------------ recent card

              private fun ago(t: Long): String {
                  val m = (System.currentTimeMillis() - t) / 60000
                  return when {
                      m < 1 -> "just now"
                      m < 60 -> "${m}m ago"
                      m < 1440 -> "${m / 60}h ago"
                      else -> "${m / 1440}d ago"
                  }
              }

              private fun avgColor(d: Drawable): Int {
                  val b = toBitmap(d, 16, 16)
                  var r = 0L; var g = 0L; var bl = 0L; var n = 0L
                  for (y in 0 until 16) for (x in 0 until 16) {
                      val c = b.getPixel(x, y)
                      if (Color.alpha(c) > 40) { r += Color.red(c); g += Color.green(c); bl += Color.blue(c); n++ }
                  }
                  b.recycle()
                  return if (n == 0L) 0xFF2A4A7A.toInt() else Color.rgb((r / n).toInt(), (g / n).toInt(), (bl / n).toInt())
              }

              private fun updateRecent() {
                  if (cfg.recentOn != 1) { recent.visibility = View.GONE; return }
                  recent.visibility = View.VISIBLE
                  val pkg = cfg.recentPkg
                  if (pkg == null) { recent.showEmpty(); return }
                  try {
                      val pm = packageManager
                      val label = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString()
                      val tint = avgColor(pm.getApplicationIcon(pkg))
                      recent.show(label, "Opened " + ago(cfg.recentTime), pm.getApplicationIcon(pkg), tint)
                  } catch (e: Exception) {
                      recent.showEmpty()
                  }
              }

              private fun online(): Boolean = try {
                  val cm = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                  if (Build.VERSION.SDK_INT >= 23) {
                      val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                      caps != null && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                  } else {
                      cm.activeNetworkInfo?.isConnected == true
                  }
              } catch (e: Exception) { true }

              // ------------------------------------------------------------------ overlay (settings, menus, picker)

              private fun choice(title: String, names: List<String>, get: () -> Int, set: (Int) -> Unit): Row {
                  val n = names.size
                  fun step(d: Int) { set(((get() + d) % n + n) % n); applyConfig() }
                  return Row(title, value = { names[get().coerceIn(0, n - 1)] }, onLeft = { step(-1) }, onRight = { step(1) }, onOk = { step(1) })
              }

              private fun section(t: String) = Row(t, section = true, onOk = {})

              private fun openSettings() {
                  val offOn = listOf("Off", "On")
                  val hideShow = listOf("Hide", "Show")
                  showOverlay("Settings", listOf(
                      section("LAYOUT"),
                      choice("Row position", listOf("Center", "Lower", "Bottom"), { cfg.pos }, { cfg.pos = it }),
                      choice("Tile size", listOf("Small", "Medium", "Large"), { cfg.tileSize }, { cfg.tileSize = it }),
                      choice("Corners", listOf("Square", "Rounded", "Pill"), { cfg.corners }, { cfg.corners = it }),
                      choice("Tile art", listOf("Smart (banners)", "Online logos", "Icons only"), { cfg.art }, { cfg.art = it }),
                      choice("App names", listOf("On focus", "Always", "Never"), { cfg.names }, { cfg.names = it }),
                      choice("Recent activity", hideShow, { cfg.recentOn }, { cfg.recentOn = it }),
                      section("LOOK"),
                      choice("Wallpaper", Config.WALL_NAMES, { cfg.wall }, { cfg.wall = it }),
                      choice("Accent color", Config.ACCENT_NAMES, { cfg.accentIndex }, { cfg.accentIndex = it }),
                      choice("Font", Config.FONT_NAMES, { cfg.font }, { cfg.font = it }),
                      choice("Focus zoom", listOf("Off", "Small", "Large"), { cfg.zoom }, { cfg.zoom = it }),
                      choice("Glow", offOn, { cfg.glow }, { cfg.glow = it }),
                      choice("Animation speed", Config.SPEED_NAMES, { cfg.speedIndex }, { cfg.speedIndex = it }),
                      choice("Effects (Lite = fastest)", listOf("Full", "Lite"), { cfg.effects }, { cfg.effects = it }),
                      section("HEADER"),
                      Row("Logo text", value = { cfg.logo }, onOk = {
                          closeOverlay()
                          prompt("Logo text", cfg.logo) { if (it.isNotEmpty()) { cfg.logo = it; applyConfig() } }
                      }),
                      choice("Clock style", listOf("Small (header)", "Big"), { cfg.clockStyle }, { cfg.clockStyle = it }),
                      choice("Clock format", listOf("24-hour", "12-hour"), { cfg.clock12 }, { cfg.clock12 = it }),
                      choice("Date", hideShow, { cfg.showDate }, { cfg.showDate = it }),
                      choice("Wi-Fi icon", hideShow, { cfg.wifiOn }, { cfg.wifiOn = it }),
                      choice("Weather", offOn, { cfg.weatherOn }, { cfg.weatherOn = it }),
                      section("ADVANCED"),
                      Row("Wallpaper photo URL", value = { cfg.wallUrl.removePrefix("https://").take(24) }, onOk = {
                          closeOverlay()
                          prompt("Wallpaper photo URL", cfg.wallUrl) {
                              if (it.length > 8) { cfg.wallUrl = it; bg.photo = null; loadWallpaper(true) }
                          }
                      }),
                      Row("Refresh online art and photo") {
                          Net.clearCache(this)
                          apps.forEach { it.online = null; it.onlineAmbient = null }
                          adapter.notifyDataSetChanged()
                          if (cfg.wall == 3) loadWallpaper(true)
                          fetchOnline()
                          closeOverlay()
                      },
                      Row("Reset apps to default") {
                          cfg.pinned = null
                          closeOverlay()
                          loadApps(true)
                      },
                      Row("Reset everything") {
                          cfg.prefs.edit().clear().apply()
                          bg.photo = null
                          apps = emptyList()
                          closeOverlay()
                          builtSize = -1
                          applyConfig()
                          loadApps(true)
                      }
                  ))
              }

              private fun buildRow(row: Row): View {
                  if (row.section) {
                      return tv(row.title, 12f, 0x80FFFFFF.toInt()).apply {
                          letterSpacing = 0.14f
                          setPadding(s(6), s(12), 0, s(4))
                      }
                  }
                  val v = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      isFocusable = true
                      isClickable = true
                      setPadding(s(18), s(12), s(18), s(12))
                      background = StateListDrawable().apply {
                          addState(intArrayOf(android.R.attr.state_focused), roundRect(0x26FFFFFF, cfg.accent, 14))
                          addState(intArrayOf(), roundRect(0x00000000, 0x00000000, 14))
                      }
                  }
                  row.icon?.let {
                      val iv = ImageView(this)
                      iv.setImageDrawable(it)
                      v.addView(iv, LinearLayout.LayoutParams(s(34), s(34)).apply { marginEnd = s(16) })
                  }
                  v.addView(tv(row.title, 19f, Color.WHITE).apply { typeface = face }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  if (row.value != null) {
                      val vt = tv("", 18f, cfg.accent)
                      v.addView(vt, LinearLayout.LayoutParams(WRAP, WRAP))
                      valueViews.add(row to vt)
                  }
                  v.setOnClickListener { row.onOk(); refreshValues() }
                  v.setOnKeyListener { _, code, ev ->
                      if (ev.action == KeyEvent.ACTION_DOWN) {
                          if (code == KeyEvent.KEYCODE_DPAD_LEFT && row.onLeft != null) {
                              row.onLeft.invoke(); refreshValues(); return@setOnKeyListener true
                          }
                          if (code == KeyEvent.KEYCODE_DPAD_RIGHT && row.onRight != null) {
                              row.onRight.invoke(); refreshValues(); return@setOnKeyListener true
                          }
                      }
                      false
                  }
                  return v
              }

              private fun refreshValues() {
                  for ((r, t) in valueViews) {
                      val txt = r.value?.invoke() ?: ""
                      t.text = if (r.onLeft != null) "‹  $txt  ›" else txt
                  }
              }

              private fun showOverlay(title: String, rows: List<Row>) {
                  prevFocus = currentFocus
                  overlayTitle.text = title
                  overlayList.removeAllViews()
                  valueViews.clear()
                  for (r in rows) {
                      overlayList.addView(buildRow(r), LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = s(6) })
                  }
                  refreshValues()
                  val lp = scroll.layoutParams
                  lp.height = minOf(rows.size * s(60), s(340))
                  scroll.layoutParams = lp
                  scroll.scrollTo(0, 0)
                  content.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  overlayOpen = true
                  overlay.visibility = View.VISIBLE
                  overlay.alpha = 0f
                  overlay.animate().alpha(1f).setDuration(160).start()
                  content.animate().alpha(0.25f).setDuration(160).start()
                  overlayList.post {
                      for (i in 0 until overlayList.childCount) {
                          val c = overlayList.getChildAt(i)
                          if (c.isFocusable) { c.requestFocus(); break }
                      }
                  }
              }

              private fun closeOverlay() {
                  if (!overlayOpen) return
                  overlayOpen = false
                  overlay.animate().alpha(0f).setDuration(140).withEndAction {
                      if (!overlayOpen) overlay.visibility = View.GONE
                  }.start()
                  content.animate().alpha(1f).setDuration(160).start()
                  content.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  val target = prevFocus
                  if (target != null && target.isAttachedToWindow) target.requestFocus() else gear.requestFocus()
              }

              // ------------------------------------------------------------------ tile adapter

              private fun artFor(a: AppEntry, v: TileView) {
                  val custom = cfg.img(a.pkg) != null
                  val on = a.online
                  if (on != null && (custom || cfg.art == 1)) {
                      if (a.onlineWide) v.setArt(on, null, null)
                      else v.setArt(null, a.onlineAmbient, BitmapDrawable(resources, on))
                  } else if (cfg.art == 2) {
                      v.setArt(null, null, a.icon)
                  } else {
                      v.setArt(a.banner, a.ambient, a.icon)
                  }
              }

              inner class TileAdapter : RecyclerView.Adapter<TileAdapter.VH>() {
                  inner class VH(val v: TileView) : RecyclerView.ViewHolder(v)

                  override fun getItemCount() = apps.size + 1

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val dims = Config.SIZES[cfg.tileSize.coerceIn(0, 2)]
                      val v = TileView(parent.context, u, dims.first, dims.second)
                      v.layoutParams = RecyclerView.LayoutParams(WRAP, WRAP)
                      return VH(v)
                  }

                  override fun onBindViewHolder(h: VH, pos: Int) {
                      val v = h.v
                      style(v)
                      v.font = face
                      v.nameMode = cfg.names
                      if (pos < apps.size) {
                          val a = apps[pos]
                          v.isAdd = false
                          v.label = a.label
                          artFor(a, v)
                          v.setOnClickListener { launch(a.pkg) }
                          v.setOnLongClickListener { appMenu(pos); true }
                      } else {
                          v.isAdd = true
                          v.label = "Add app"
                          v.setArt(null, null, null)
                          v.setOnClickListener { openPicker() }
                          v.setOnLongClickListener(null)
                          v.isLongClickable = false
                      }
                  }
              }
          }
          END_OF_FILE_12
          base64 -d app/mytv.jks.b64 > app/mytv.jks
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FlowyOs-apk
          path: app/build/outputs/apk/debug/app-debug.apk
