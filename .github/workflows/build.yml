          package com.mytv.launcher

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.sin

          /** Near-black wallpaper with thin, slowly drifting blue-gray curves. mode: 0 Flow, 1 Deep, 2 Black. */
          class FlowBackground(ctx: Context) : View(ctx) {

              var mode = 0
                  set(v) { field = v; invalidate() }
              var speed = 1f

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val glowFill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
              private val halo = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
              private val path = Path()
              private var baseShader: LinearGradient? = null
              private var glowShaderA: RadialGradient? = null
              private var glowShaderB: RadialGradient? = null
              private var lineShader: LinearGradient? = null
              private var tt = 0f
              private var lastNs = 0L

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  val fw = w.toFloat()
                  val fh = h.toFloat()
                  baseShader = LinearGradient(0f, 0f, 0f, fh, 0xFF04060A.toInt(), 0xFF090D16.toInt(), Shader.TileMode.CLAMP)
                  glowShaderA = RadialGradient(fw * 0.88f, fh * 1.02f, fw * 0.62f, 0x401E4FA0, 0x00000000, Shader.TileMode.CLAMP)
                  glowShaderB = RadialGradient(fw * 0.08f, fh * 0.05f, fw * 0.45f, 0x1A2A3A5A, 0x00000000, Shader.TileMode.CLAMP)
                  lineShader = LinearGradient(
                      0f, 0f, fw, 0f,
                      intArrayOf(0x008FA6C4, 0xFF8FA6C4.toInt(), 0x008FA6C4),
                      floatArrayOf(0f, 0.5f, 1f), Shader.TileMode.CLAMP
                  )
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w == 0f) return
                  if (mode == 2) { c.drawColor(0xFF000000.toInt()); return }

                  val now = System.nanoTime()
                  val dt = if (lastNs == 0L) 0f else ((now - lastNs) / 1e9f).coerceIn(0f, 0.1f)
                  lastNs = now
                  tt += dt * speed

                  fill.shader = baseShader
                  c.drawRect(0f, 0f, w, h, fill)
                  glowFill.shader = glowShaderA
                  c.drawRect(0f, 0f, w, h, glowFill)
                  glowFill.shader = glowShaderB
                  c.drawRect(0f, 0f, w, h, glowFill)

                  if (mode == 0) {
                      val u = w / 960f
                      line.shader = lineShader
                      halo.shader = lineShader
                      for (i in 0 until 6) {
                          val ph = tt * 0.18f + i * 0.85f
                          val by = h * (0.28f + 0.09f * i)
                          path.reset()
                          path.moveTo(-0.05f * w, by + h * 0.06f * sin(ph))
                          path.cubicTo(
                              w * 0.30f, by - h * 0.30f + h * 0.10f * sin(ph * 0.8f + i),
                              w * 0.66f, by + h * 0.32f + h * 0.10f * cos(ph * 0.7f),
                              1.05f * w, by + h * 0.05f * sin(ph * 1.3f)
                          )
                          halo.strokeWidth = 5f * u
                          halo.alpha = 12
                          c.drawPath(path, halo)
                          line.strokeWidth = 1.3f * u
                          line.alpha = 40 + i * 12
                          c.drawPath(path, line)
                      }
                      postInvalidateOnAnimation()
                  }
              }
          }
          END_OF_FILE_9
          mkdir -p $(dirname app/src/main/java/com/mytv/launcher/Views.kt)
          cat > app/src/main/java/com/mytv/launcher/Views.kt <<'END_OF_FILE_10'
          package com.mytv.launcher

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.RectF
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.text.TextPaint
          import android.text.TextUtils
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import androidx.dynamicanimation.animation.DynamicAnimation
          import androidx.dynamicanimation.animation.SpringAnimation
          import androidx.dynamicanimation.animation.SpringForce
          import kotlin.math.cos
          import kotlin.math.sin

          fun blend(a: Int, b: Int, t: Float): Int {
              fun ch(s: Int) = (((a shr s) and 0xFF) * (1f - t) + ((b shr s) and 0xFF) * t).toInt()
              return (ch(24) shl 24) or (ch(16) shl 16) or (ch(8) shl 8) or ch(0)
          }

          fun withAlpha(c: Int, a: Int) = (c and 0x00FFFFFF) or (a.coerceIn(0, 255) shl 24)

          private fun springTo(v: View, p: DynamicAnimation.ViewProperty, to: Float) {
              SpringAnimation(v, p).setSpring(SpringForce(to).setStiffness(420f).setDampingRatio(0.75f)).start()
          }

          /** Rounded glass card with a focus animation (scale, thin accent outline, soft glow). */
          abstract class GlassView(
              ctx: Context,
              protected val u: Float,
              protected val cardW: Int,
              protected val cardH: Int
          ) : View(ctx) {

              var accent: Int = 0xFF4DA3FF.toInt()
                  set(v) { field = v; invalidate() }
              var focusMs: Long = 180L

              protected var p = 0f
              protected val pad = (10 * u).toInt()
              private val rect = RectF()
              private val fillPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val shinePaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val overlayPaint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val glowPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private var shine: Shader? = null
              protected var overlayShader: Shader? = null
              private var anim: ValueAnimator? = null

              init {
                  isFocusable = true
                  isClickable = true
              }

              override fun onMeasure(wSpec: Int, hSpec: Int) {
                  setMeasuredDimension(cardW + 2 * pad, cardH + 2 * pad)
              }

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  shine = LinearGradient(0f, pad.toFloat(), 0f, pad + cardH * 0.65f, 0x2AFFFFFF, 0x00FFFFFF, Shader.TileMode.CLAMP)
              }

              override fun onFocusChanged(gainFocus: Boolean, direction: Int, previouslyFocusedRect: Rect?) {
                  super.onFocusChanged(gainFocus, direction, previouslyFocusedRect)
                  val t = if (gainFocus) 1f else 0f
                  anim?.cancel()
                  anim = ValueAnimator.ofFloat(p, t).apply {
                      duration = focusMs
                      interpolator = DecelerateInterpolator()
                      addUpdateListener { p = it.animatedValue as Float; invalidate() }
                      start()
                  }
                  val s = 1f + 0.08f * t
                  springTo(this, DynamicAnimation.SCALE_X, s)
                  springTo(this, DynamicAnimation.SCALE_Y, s)
              }

              protected fun drawGlass(c: Canvas) {
                  rect.set(pad.toFloat(), pad.toFloat(), (pad + cardW).toFloat(), (pad + cardH).toFloat())
                  val r = 22f * u
                  if (p > 0.01f) {
                      for (k in 3 downTo 1) {
                          glowPaint.color = withAlpha(accent, (40f * p / k).toInt())
                          glowPaint.strokeWidth = k * 5f * u
                          c.drawRoundRect(rect, r, r, glowPaint)
                      }
                  }
                  fillPaint.color = blend(0xFF0E121A.toInt(), 0xFF1A2130.toInt(), p)
                  c.drawRoundRect(rect, r, r, fillPaint)
                  overlayShader?.let {
                      overlayPaint.shader = it
                      c.drawRoundRect(rect, r, r, overlayPaint)
                  }
                  shinePaint.shader = shine
