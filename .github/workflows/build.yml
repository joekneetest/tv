              override fun onBackPressed() {
                  if (overlayOpen) closeOverlay()
              }

              // ------------------------------------------------------------------ apps

              private fun canLaunch(pkg: String): Boolean {
                  val pm = packageManager
                  return pm.getLeanbackLaunchIntentForPackage(pkg) != null || pm.getLaunchIntentForPackage(pkg) != null
              }

              private fun loadApps(force: Boolean) {
                  Thread {
                      val pm = packageManager
                      val pins = cfg.pinned ?: Presets.apps
                          .mapNotNull { (_, cands) -> cands.firstOrNull { canLaunch(it) } }
                          .also { cfg.pinned = it }
                      val list = pins.mapNotNull { pkg ->
                          try {
                              AppEntry(pkg, pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString(), pm.getApplicationIcon(pkg))
                          } catch (e: Exception) { null }
                      }
                      runOnUiThread {
                          if (force || list.map { it.pkg } != apps.map { it.pkg }) {
                              apps = list
                              adapter.notifyDataSetChanged()
                          }
                          if (!firstFocusDone) {
                              firstFocusDone = true
                              focusTile(0)
                          }
                      }
                  }.start()
              }

              private fun savePins() { cfg.pinned = apps.map { it.pkg } }

              private fun focusTile(idx: Int) {
                  val i = idx.coerceIn(0, apps.size)
                  tiles.scrollToPosition(i)
                  tiles.postDelayed({ tiles.findViewHolderForAdapterPosition(i)?.itemView?.requestFocus() }, 80)
              }

              private fun launch(pkg: String) {
                  val pm = packageManager
                  val i = pm.getLeanbackLaunchIntentForPackage(pkg) ?: pm.getLaunchIntentForPackage(pkg) ?: return
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  try {
                      startActivity(i)
                      cfg.recentPkg = pkg
                      cfg.recentTime = System.currentTimeMillis()
                      overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
                  } catch (e: ActivityNotFoundException) { }
              }

              private fun appMenu(i: Int) {
                  val a = apps.getOrNull(i) ?: return
                  showOverlay(a.label, listOf(
                      Row("Move left") { move(i, -1) },
                      Row("Move right") { move(i, 1) },
                      Row("Remove") { remove(i) },
                      Row("App info") {
                          closeOverlay()
                          startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:${a.pkg}")))
                      }
                  ))
              }

              private fun move(i: Int, d: Int) {
                  val j = i + d
                  if (j < 0 || j >= apps.size) { closeOverlay(); return }
                  val m = apps.toMutableList()
                  val t = m[i]; m[i] = m[j]; m[j] = t
                  apps = m
                  savePins()
                  adapter.notifyDataSetChanged()
                  closeOverlay()
                  focusTile(j)
              }

              private fun remove(i: Int) {
                  apps = apps.filterIndexed { k, _ -> k != i }
                  savePins()
                  adapter.notifyDataSetChanged()
                  closeOverlay()
                  focusTile(i)
              }

              private fun openPicker() {
                  Thread {
                      val pm = packageManager
                      fun q(cat: String) = pm.queryIntentActivities(Intent(Intent.ACTION_MAIN).addCategory(cat), 0)
                      val pinned = apps.map { it.pkg }.toSet()
                      val rows = (q(Intent.CATEGORY_LEANBACK_LAUNCHER) + q(Intent.CATEGORY_LAUNCHER))
                          .map { it.activityInfo.packageName }
                          .distinct()
                          .filter { it != packageName && it !in pinned }
                          .mapNotNull { pkg ->
                              try {
                                  AppEntry(pkg, pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString(), pm.getApplicationIcon(pkg))
                              } catch (e: Exception) { null }
                          }
                          .sortedBy { it.label.lowercase() }
                          .map { e ->
                              Row(e.label, icon = e.icon) {
                                  apps = apps + e
                                  savePins()
                                  adapter.notifyDataSetChanged()
                                  closeOverlay()
                                  focusTile(apps.size - 1)
                              }
                          }
                      runOnUiThread { showOverlay("Add app", rows) }
                  }.start()
              }

              // ------------------------------------------------------------------ recent card

              private fun ago(t: Long): String {
                  val m = (System.currentTimeMillis() - t) / 60000
                  return when {
                      m < 1 -> "just now"
                      m < 60 -> "${m}m ago"
                      m < 1440 -> "${m / 60}h ago"
                      else -> "${m / 1440}d ago"
                  }
              }

              private fun avgColor(d: Drawable): Int {
                  val b = Bitmap.createBitmap(16, 16, Bitmap.Config.ARGB_8888)
                  d.setBounds(0, 0, 16, 16)
                  d.draw(Canvas(b))
                  var r = 0L; var g = 0L; var bl = 0L; var n = 0L
                  for (y in 0 until 16) for (x in 0 until 16) {
                      val c = b.getPixel(x, y)
                      if (Color.alpha(c) > 40) { r += Color.red(c); g += Color.green(c); bl += Color.blue(c); n++ }
                  }
                  b.recycle()
                  return if (n == 0L) 0xFF2A4A7A.toInt() else Color.rgb((r / n).toInt(), (g / n).toInt(), (bl / n).toInt())
              }

              private fun updateRecent() {
                  val pkg = cfg.recentPkg
                  if (!cfg.recentOn || pkg == null) { recent.visibility = View.GONE; return }
                  try {
                      val pm = packageManager
                      val icon = pm.getApplicationIcon(pkg)
                      recent.title = pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString()
                      recent.meta = "Opened " + ago(cfg.recentTime)
                      recent.tint = avgColor(icon)
                      recent.icon = pm.getApplicationIcon(pkg)
                      recent.visibility = View.VISIBLE
                  } catch (e: Exception) {
                      recent.visibility = View.GONE
                  }
              }

              private fun online(): Boolean = try {
                  val cm = getSystemService(CONNECTIVITY_SERVICE) as ConnectivityManager
                  if (Build.VERSION.SDK_INT >= 23) {
                      val caps = cm.getNetworkCapabilities(cm.activeNetwork)
                      caps != null && caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                  } else {
                      cm.activeNetworkInfo?.isConnected == true
                  }
              } catch (e: Exception) { true }

              // ------------------------------------------------------------------ overlay (settings, menus, picker)

              private fun choice(title: String, names: List<String>, get: () -> Int, set: (Int) -> Unit): Row {
                  val n = names.size
                  fun step(d: Int) { set((get() + d + n) % n); applyConfig() }
                  return Row(title, value = { names[get()] }, onLeft = { step(-1) }, onRight = { step(1) }, onOk = { step(1) })
              }

              private fun openSettings() {
                  showOverlay("Settings", listOf(
                      choice("Wallpaper", Config.WALL_NAMES, { cfg.wall }, { cfg.wall = it }),
                      choice("Accent color", Config.ACCENT_NAMES, { cfg.accentIndex }, { cfg.accentIndex = it }),
                      choice("Animation speed", Config.SPEED_NAMES, { cfg.speedIndex }, { cfg.speedIndex = it }),
                      choice("Clock", listOf("24-hour", "12-hour"), { if (cfg.clock12) 1 else 0 }, { cfg.clock12 = it == 1 }),
                      choice("Recent activity", listOf("Show", "Hide"), { if (cfg.recentOn) 0 else 1 }, { cfg.recentOn = it == 0 }),
                      Row("Reset apps to default") {
                          cfg.pinned = null
                          closeOverlay()
                          loadApps(true)
                      }
                  ))
              }

              private fun buildRow(row: Row): View {
                  val v = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      isFocusable = true
                      isClickable = true
                      setPadding(s(18), s(12), s(18), s(12))
                      background = StateListDrawable().apply {
                          addState(intArrayOf(android.R.attr.state_focused), roundRect(0x26FFFFFF, cfg.accent, 14))
                          addState(intArrayOf(), roundRect(0x00000000, 0x00000000, 14))
                      }
                  }
                  row.icon?.let {
                      val iv = ImageView(this)
                      iv.setImageDrawable(it)
                      v.addView(iv, LinearLayout.LayoutParams(s(34), s(34)).apply { marginEnd = s(16) })
                  }
                  v.addView(tv(row.title, 19f, Color.WHITE), LinearLayout.LayoutParams(0, WRAP, 1f))
                  if (row.value != null) {
                      val vt = tv("", 18f, cfg.accent, "sans-serif-medium")
                      v.addView(vt, LinearLayout.LayoutParams(WRAP, WRAP))
                      valueViews.add(row to vt)
                  }
                  v.setOnClickListener { row.onOk(); refreshValues() }
                  v.setOnKeyListener { _, code, ev ->
                      if (ev.action == KeyEvent.ACTION_DOWN) {
                          if (code == KeyEvent.KEYCODE_DPAD_LEFT && row.onLeft != null) {
                              row.onLeft.invoke(); refreshValues(); return@setOnKeyListener true
                          }
                          if (code == KeyEvent.KEYCODE_DPAD_RIGHT && row.onRight != null) {
                              row.onRight.invoke(); refreshValues(); return@setOnKeyListener true
                          }
                      }
                      false
                  }
                  return v
              }

              private fun refreshValues() {
                  for ((r, t) in valueViews) {
                      val txt = r.value?.invoke() ?: ""
                      t.text = if (r.onLeft != null) "‹  $txt  ›" else txt
                  }
              }

              private fun showOverlay(title: String, rows: List<Row>) {
                  prevFocus = currentFocus
                  overlayTitle.text = title
                  overlayList.removeAllViews()
                  valueViews.clear()
                  for (r in rows) {
                      overlayList.addView(buildRow(r), LinearLayout.LayoutParams(MATCH, WRAP).apply { bottomMargin = s(6) })
                  }
                  refreshValues()
                  val lp = scroll.layoutParams
                  lp.height = minOf(rows.size * s(60), s(330))
                  scroll.layoutParams = lp
                  scroll.scrollTo(0, 0)
                  content.descendantFocusability = ViewGroup.FOCUS_BLOCK_DESCENDANTS
                  overlayOpen = true
                  overlay.visibility = View.VISIBLE
                  overlay.alpha = 0f
                  overlay.animate().alpha(1f).setDuration(160).start()
                  content.animate().alpha(0.25f).setDuration(160).start()
                  overlayList.post { overlayList.getChildAt(0)?.requestFocus() }
              }

              private fun closeOverlay() {
                  if (!overlayOpen) return
                  overlayOpen = false
                  overlay.animate().alpha(0f).setDuration(140).withEndAction {
                      if (!overlayOpen) overlay.visibility = View.GONE
                  }.start()
                  content.animate().alpha(1f).setDuration(160).start()
                  content.descendantFocusability = ViewGroup.FOCUS_AFTER_DESCENDANTS
                  val target = prevFocus
                  if (target != null && target.isAttachedToWindow) target.requestFocus() else gear.requestFocus()
              }

              // ------------------------------------------------------------------ tile adapter

              inner class TileAdapter : RecyclerView.Adapter<TileAdapter.VH>() {
                  inner class VH(val v: TileView) : RecyclerView.ViewHolder(v)

                  override fun getItemCount() = apps.size + 1

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): VH {
                      val v = TileView(parent.context, u)
                      v.layoutParams = RecyclerView.LayoutParams(WRAP, WRAP)
                      return VH(v)
                  }

                  override fun onBindViewHolder(h: VH, pos: Int) {
                      val v = h.v
                      v.accent = cfg.accent
                      v.focusMs = (180f / cfg.speed).toLong()
                      if (pos < apps.size) {
                          val a = apps[pos]
                          v.isAdd = false
                          v.icon = a.icon
                          v.label = a.label
                          v.setOnClickListener { launch(a.pkg) }
                          v.setOnLongClickListener { appMenu(pos); true }
                      } else {
                          v.isAdd = true
                          v.icon = null
                          v.label = "Add app"
                          v.setOnClickListener { openPicker() }
                          v.setOnLongClickListener(null)
                          v.isLongClickable = false
                      }
                  }
              }
          }
