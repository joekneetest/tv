          package com.mytv.launcher

          import android.content.Context
          import android.content.SharedPreferences

          /** Apps offered by default. First installed package of each entry is pinned on first run. */
          object Presets {
              val apps: List<Pair<String, List<String>>> = listOf(
                  "Spotify" to listOf("com.spotify.tv.android", "com.spotify.music"),
                  "YouTube" to listOf("com.google.android.youtube.tv", "com.google.android.youtube"),
                  "Netflix" to listOf("com.netflix.ninja", "com.netflix.mediaclient"),
                  "Discord" to listOf("com.discord"),
                  "Twitch" to listOf("tv.twitch.android.app", "tv.twitch.android.viewer"),
                  "ChatGPT" to listOf("com.openai.chatgpt"),
                  "Steam" to listOf("com.valvesoftware.steamlink", "com.valvesoftware.android.steam.community")
              )
          }

          /** All user-changeable settings live here. */
          class Config(ctx: Context) {
              private val p: SharedPreferences = ctx.getSharedPreferences("mytv", Context.MODE_PRIVATE)

              companion object {
                  val ACCENT_NAMES = listOf("Blue", "White", "Teal", "Violet")
                  val ACCENTS = listOf(0xFF4DA3FF.toInt(), 0xFFFFFFFF.toInt(), 0xFF2DD4BF.toInt(), 0xFF8B7CFF.toInt())
                  val WALL_NAMES = listOf("Flow", "Deep", "Black")
                  val SPEED_NAMES = listOf("Slow", "Normal", "Fast")
                  val SPEEDS = listOf(0.5f, 1f, 1.7f)
              }

              var accentIndex: Int
                  get() = p.getInt("accent", 0).coerceIn(0, ACCENTS.size - 1)
                  set(v) { p.edit().putInt("accent", v).apply() }
              var wall: Int
                  get() = p.getInt("wall", 0).coerceIn(0, WALL_NAMES.size - 1)
                  set(v) { p.edit().putInt("wall", v).apply() }
              var speedIndex: Int
                  get() = p.getInt("speed", 1).coerceIn(0, SPEEDS.size - 1)
                  set(v) { p.edit().putInt("speed", v).apply() }
              var clock12: Boolean
                  get() = p.getBoolean("clock12", false)
                  set(v) { p.edit().putBoolean("clock12", v).apply() }
              var recentOn: Boolean
                  get() = p.getBoolean("recent_on", true)
                  set(v) { p.edit().putBoolean("recent_on", v).apply() }
              var recentPkg: String?
                  get() = p.getString("recent_pkg", null)
                  set(v) { p.edit().putString("recent_pkg", v).apply() }
              var recentTime: Long
                  get() = p.getLong("recent_time", 0L)
                  set(v) { p.edit().putLong("recent_time", v).apply() }
              var pinned: List<String>?
                  get() = p.getString("pinned", null)?.split(",")?.filter { it.isNotEmpty() }
                  set(v) { p.edit().putString("pinned", v?.joinToString(",")).apply() }

              val accent: Int get() = ACCENTS[accentIndex]
              val speed: Float get() = SPEEDS[speedIndex]
          }
