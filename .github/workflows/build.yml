          package com.mytv.launcher

          import android.content.Context
          import android.content.SharedPreferences
          import kotlin.reflect.KProperty

          class IntPref(private val p: SharedPreferences, private val k: String, private val d: Int) {
              operator fun getValue(thisRef: Any?, property: KProperty<*>): Int = p.getInt(k, d)
              operator fun setValue(thisRef: Any?, property: KProperty<*>, value: Int) { p.edit().putInt(k, value).apply() }
          }

          class StrPref(private val p: SharedPreferences, private val k: String, private val d: String) {
              operator fun getValue(thisRef: Any?, property: KProperty<*>): String = p.getString(k, d) ?: d
              operator fun setValue(thisRef: Any?, property: KProperty<*>, value: String) { p.edit().putString(k, value).apply() }
          }

          class Preset(val name: String, val pkgs: List<String>, val domain: String)

          /** Apps pinned by default (first installed package of each). Edit this list to change the defaults. */
          object Presets {
              val apps = listOf(
                  Preset("Spotify", listOf("com.spotify.tv.android", "com.spotify.music"), "spotify.com"),
                  Preset("YouTube", listOf("com.google.android.youtube.tv", "com.google.android.youtube"), "youtube.com"),
                  Preset("Netflix", listOf("com.netflix.ninja", "com.netflix.mediaclient"), "netflix.com"),
                  Preset("Discord", listOf("com.discord"), "discord.com"),
                  Preset("Twitch", listOf("tv.twitch.android.app", "tv.twitch.android.viewer"), "twitch.tv"),
                  Preset("ChatGPT", listOf("com.openai.chatgpt"), "chatgpt.com"),
                  Preset("Steam", listOf("com.valvesoftware.steamlink", "com.valvesoftware.android.steam.community"), "steampowered.com")
              )

              fun domainFor(pkg: String): String? = apps.firstOrNull { pkg in it.pkgs }?.domain
          }

          /** Every user setting. Values are saved instantly. */
          class Config(ctx: Context) {
              val prefs: SharedPreferences = ctx.getSharedPreferences("flowyos", Context.MODE_PRIVATE)

              companion object {
                  const val DEFAULT_WALL = "https://picsum.photos/1920/1080"
                  val ACCENT_NAMES = listOf("Blue", "White", "Teal", "Violet", "Rose", "Orange", "Green")
                  val ACCENTS = listOf(
                      0xFF4DA3FF.toInt(), 0xFFFFFFFF.toInt(), 0xFF2DD4BF.toInt(), 0xFF8B7CFF.toInt(),
                      0xFFFF6B9D.toInt(), 0xFFFFA54D.toInt(), 0xFF5BE37D.toInt()
                  )
                  val WALL_NAMES = listOf("Flow", "Deep", "Black", "Photo (online)")
                  val SPEED_NAMES = listOf("Slow", "Normal", "Fast")
                  val SPEEDS = listOf(0.5f, 1f, 1.7f)
                  val SIZES = listOf(150 to 88, 176 to 104, 200 to 118)
                  val RADII = listOf(8f, 22f, 52f)
                  val ZOOMS = listOf(0f, 0.06f, 0.11f)
                  val FONT_NAMES = listOf("Modern", "Light", "Condensed", "Serif")
                  val FONTS = listOf("sans-serif-medium", "sans-serif-light", "sans-serif-condensed", "serif")
              }

              // layout
              var pos by IntPref(prefs, "pos", 1)
              var tileSize by IntPref(prefs, "size", 1)
              var corners by IntPref(prefs, "corners", 1)
              var art by IntPref(prefs, "art", 0)
              var names by IntPref(prefs, "names", 0)
              // look
              var wall by IntPref(prefs, "wall", 0)
              var accentIndex by IntPref(prefs, "accent", 0)
              var zoom by IntPref(prefs, "zoom", 1)
              var glow by IntPref(prefs, "glow", 1)
              var speedIndex by IntPref(prefs, "speed", 1)
              var effects by IntPref(prefs, "effects", 0)
              var font by IntPref(prefs, "font", 0)
              // header
              var clockStyle by IntPref(prefs, "clockstyle", 0)
              var clock12 by IntPref(prefs, "clock12", 0)
              var showDate by IntPref(prefs, "date", 1)
              var wifiOn by IntPref(prefs, "wifi", 1)
              var weatherOn by IntPref(prefs, "weather", 0)
              var recentOn by IntPref(prefs, "recent", 1)
              var logo by StrPref(prefs, "logo", "FlowyOs")
              var wallUrl by StrPref(prefs, "wallurl", DEFAULT_WALL)

              val accent: Int get() = ACCENTS[accentIndex.coerceIn(0, ACCENTS.size - 1)]
              val speed: Float get() = SPEEDS[speedIndex.coerceIn(0, SPEEDS.size - 1)]

              var recentPkg: String?
                  get() = prefs.getString("recent_pkg", null)
                  set(v) { prefs.edit().putString("recent_pkg", v).apply() }
              var recentTime: Long
                  get() = prefs.getLong("recent_time", 0L)
                  set(v) { prefs.edit().putLong("recent_time", v).apply() }
              var pinned: List<String>?
                  get() = prefs.getString("pinned", null)?.split(",")?.filter { it.isNotEmpty() }
                  set(v) { prefs.edit().putString("pinned", v?.joinToString(",")).apply() }

              fun img(pkg: String): String? = prefs.getString("img_$pkg", null)
              fun setImg(pkg: String, v: String?) { prefs.edit().putString("img_$pkg", v).apply() }
              fun label(pkg: String): String? = prefs.getString("lbl_$pkg", null)
              fun setLabel(pkg: String, v: String) { prefs.edit().putString("lbl_$pkg", v).apply() }
          }
          END_OF_FILE_8
          mkdir -p $(dirname app/src/main/java/com/mytv/launcher/Net.kt)
          cat > app/src/main/java/com/mytv/launcher/Net.kt <<'END_OF_FILE_9'
          package com.mytv.launcher

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          /** Tiny network + image helper. Everything here must be called off the main thread. */
          object Net {
              fun fetch(url: String): ByteArray? = try {
                  val c = URL(url).openConnection() as HttpURLConnection
                  c.connectTimeout = 6000
                  c.readTimeout = 8000
                  c.instanceFollowRedirects = true
                  c.setRequestProperty("User-Agent", "FlowyOs/1.0")
                  val b = c.inputStream.use { it.readBytes() }
                  c.disconnect()
                  b
              } catch (e: Exception) { null }

              fun text(url: String): String? = fetch(url)?.toString(Charsets.UTF_8)

              fun decode(b: ByteArray, maxSide: Int): Bitmap? {
                  return try {
                      val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                      BitmapFactory.decodeByteArray(b, 0, b.size, o)
                      var s = 1
                      while (maxOf(o.outWidth, o.outHeight) / s > maxSide * 2) s *= 2
                      val o2 = BitmapFactory.Options().apply { inSampleSize = s }
                      BitmapFactory.decodeByteArray(b, 0, b.size, o2)
                  } catch (e: Exception) { null }
              }

              /** Disk-cached download. The second time an image is needed it comes straight from storage. */
              fun get(ctx: Context, url: String, maxSide: Int): Bitmap? {
                  val f = File(ctx.cacheDir, "img_" + Integer.toHexString(url.hashCode()))
                  var bytes: ByteArray? = if (f.exists()) f.readBytes() else null
                  if (bytes == null) {
                      bytes = fetch(url)
                      if (bytes != null) try { f.writeBytes(bytes) } catch (e: Exception) { }
                  }
                  return bytes?.let { decode(it, maxSide) }
              }

              fun clearCache(ctx: Context) {
                  ctx.cacheDir.listFiles()?.forEach { if (it.name.startsWith("img_")) it.delete() }
              }
          }
          END_OF_FILE_9
          mkdir -p $(dirname app/src/main/java/com/mytv/launcher/FlowBackground.kt)
          cat > app/src/main/java/com/mytv/launcher/FlowBackground.kt <<'END_OF_FILE_10'
          package com.mytv.launcher

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.LinearGradient
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RadialGradient
          import android.graphics.Shader
          import android.view.View
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.sin

          /** Wallpaper. mode: 0 Flow (drifting curves), 1 Deep (glow only), 2 Black, 3 Photo (online). lite = no animation. */
          class FlowBackground(ctx: Context) : View(ctx) {

              var mode = 0
                  set(v) { field = v; invalidate() }
              var speed = 1f
              var lite = false
                  set(v) { field = v; invalidate() }
              var photo: Bitmap? = null
                  set(v) { field = v; rebuildPhoto(); invalidate() }

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val glowFill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val photoPaint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
              private val halo = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }
              private val path = Path()
              private var baseShader: LinearGradient? = null
              private var glowShaderA: RadialGradient? = null
              private var glowShaderB: RadialGradient? = null
              private var lineShader: LinearGradient? = null
              private var scrimShader: LinearGradient? = null
              private var photoShader: BitmapShader? = null
              private var tt = 0f
              private var lastNs = 0L

              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) {
                  super.onSizeChanged(w, h, ow, oh)
                  val fw = w.toFloat()
                  val fh = h.toFloat()
                  baseShader = LinearGradient(0f, 0f, 0f, fh, 0xFF04060A.toInt(), 0xFF090D16.toInt(), Shader.TileMode.CLAMP)
                  glowShaderA = RadialGradient(fw * 0.88f, fh * 1.02f, fw * 0.62f, 0x401E4FA0, 0x00000000, Shader.TileMode.CLAMP)
                  glowShaderB = RadialGradient(fw * 0.08f, fh * 0.05f, fw * 0.45f, 0x1A2A3A5A, 0x00000000, Shader.TileMode.CLAMP)
                  lineShader = LinearGradient(
                      0f, 0f, fw, 0f,
                      intArrayOf(0x008FA6C4, 0xFF8FA6C4.toInt(), 0x008FA6C4),
                      floatArrayOf(0f, 0.5f, 1f), Shader.TileMode.CLAMP
                  )
                  scrimShader = LinearGradient(0f, 0f, 0f, fh, 0x8C000000.toInt(), 0xE0000000.toInt(), Shader.TileMode.CLAMP)
                  rebuildPhoto()
              }

              private fun rebuildPhoto() {
                  val b = photo
                  if (b == null || width == 0 || height == 0) { photoShader = null; return }
                  val sh = BitmapShader(b, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP)
                  val sc = max(width.toFloat() / b.width, height.toFloat() / b.height)
                  val m = Matrix()
                  m.setScale(sc, sc)
                  m.postTranslate((width - b.width * sc) / 2f, (height - b.height * sc) / 2f)
                  sh.setLocalMatrix(m)
                  photoShader = sh
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (w == 0f) return
                  if (mode == 2) { c.drawColor(0xFF000000.toInt()); return }

                  val ph = photoShader
                  if (mode == 3 && ph != null) {
                      photoPaint.shader = ph
                      c.drawRect(0f, 0f, w, h, photoPaint)
